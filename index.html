<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024" />
    <title>The Purple List</title>
    <!-- Fully qualified paths tell the browser exactly where files sit -->
    <link rel="icon" href="/ThePurpleList/list_icon.png" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/typography.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/main.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/pages/list.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/pages/leaderboard.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/pages/roulette.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/components/nav.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/components/btn.css" />
    <link rel="stylesheet" type="text/css" href="/ThePurpleList/css/components/tabs.css" />
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <!-- Hardcoded absolute root prevents sub-script files from throwing 404 errors -->
    <script type="module" src="/ThePurpleList/js/main.js"></script>
  </head>
  <body id="app">
    <header :class="{ dark: store.dark }">
      <div class="logo">
        <h2>The Purple List</h2>
        <p>v1.0.0</p>
      </div>
      <nav class="nav">
        <router-link class="nav__tab" to="/">
          <span class="type-label-lg">List</span>
        </router-link>
        <router-link class="nav__tab" to="/leaderboard">
          <span class="type-label-lg">Leaderboard</span>
        </router-link>
        <router-link class="nav__tab" to="/roulette">
          <span class="type-label-lg">Roulette</span>
        </router-link>
        <div class="nav__actions">
          <button class="nav__icon" @click.prevent="store.toggleDark()" >
            <img :src="store.dark ? '/ThePurpleList/assets/light.svg' : '/ThePurpleList/assets/dark.svg'" alt="" />
          </button>
          <a class="nav__icon" href="#">
            <img src="/ThePurpleList/assets/discord.svg" alt="Discord Logo" />
          </a>
          <a class="nav__cta type-label-lg" href="#" target="_blank" >Submit Record</a >
        </div>
      </nav>
    </header>
    <router-view :class="{ dark: store.dark }"></router-view>
  </body>
</html>
